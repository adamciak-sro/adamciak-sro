media:
  - name: images
    label: Obrázky
    input: assets
    output: assets
    extensions: [jpg, jpeg, png, webp, JPG, JPEG, PNG, WEBP]
    categories: [image]
    rename: safe

content:
  - name: site
    label: Nastavenie stránky
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: company
        label: Názov firmy
        type: string
      - name: branding
        label: Značka a titulná fotografia
        type: object
        fields:
          - name: logo
            label: Logo
            type: image
            options:
              media: images
          - name: hero
            label: Titulná fotografia
            type: image
            options:
              media: images
      - name: about
        label: O nás
        type: object
        fields:
          - name: title
            label: Nadpis
            type: string
          - name: paragraphs
            label: Úvodné odseky
            type: text
            list: true
          - name: highlight
            label: Zvýraznený text
            type: text
          - name: pillars
            label: Štyri piliere
            type: string
            list: true
          - name: closing
            label: Záverečný text
            type: text
          - name: signature
            label: Podpis
            type: string
      - name: services
        label: Služby
        type: object
        list: true
        fields:
          - name: title
            label: Názov služby
            type: string
          - name: details
            label: Podrobnosti (rozkliknutie)
            type: string
            list: true
      - name: contact
        label: Kontakt
        type: object
        fields:
          - name: ico
            label: IČO
            type: string
          - name: icdph
            label: IČ DPH
            type: string
          - name: phone
            label: Hlavný telefón
            type: string
          - name: phones
            label: Telefónne čísla
            type: string
            list: true
          - name: email
            label: E-mail
            type: string
          - name: registered
            label: Sídlo
            type: string
          - name: operation
            label: Prevádzka
            type: string
          - name: hours
            label: Otváracie hodiny
            type: string
          - name: map
            label: Odkaz na mapu
            type: string
          - name: formspreeEndpoint
            label: Formulár – technické nastavenie
            type: string
          - name: socials
            label: Sociálne siete
            type: object
            fields:
              - name: facebook
                label: Facebook
                type: string
              - name: instagram
                label: Instagram
                type: string

  - name: references
    label: Referencie
    type: file
    path: data/references.json
    format: json
    list: true
    fields:
      - name: title
        label: Názov projektu
        type: string
        required: true
      - name: description
        label: Popis projektu
        type: text
      - name: images
        label: Fotografie projektu
        type: image
        options:
          media: images
          multiple:
            max: 30
          unique: true
          extensions: [jpg, jpeg, png, webp, JPG, JPEG, PNG, WEBP]
          rename: safe

  - name: blog
    label: Blog
    type: file
    path: data/blog.json
    format: json
    list: true
    fields:
      - name: title
        label: Nadpis článku
        type: string
        required: true
      - name: date
        label: Dátum
        type: string
      - name: body
        label: Text článku
        type: rich-text
      - name: image
        label: Úvodná fotografia
        type: image
        options:
          media: images

settings:
  content:
    merge: true
